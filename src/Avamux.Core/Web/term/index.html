<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>avamux terminals</title>
<link rel="stylesheet" href="xterm.css">
<style>
  @font-face { font-family: "avamux-symbols"; src: url("fonts/SymbolsNerdFontMono-Regular.ttf") format("truetype"); font-display: block; }
  html, body { margin: 0; height: 100%; background: #11131a; overflow: hidden; }
  #root { position: absolute; inset: 0; }
  .term { position: absolute; inset: 4px 0 0 6px; visibility: hidden; }
  .term.active { visibility: visible; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           color: #6b7280; font: 14px system-ui, sans-serif; }
  #menu { position: absolute; display: none; z-index: 10; background: var(--panel, #1f2330); border: 1px solid var(--line, #3b4252); border-radius: 6px;
          padding: 4px; font: 13px system-ui, sans-serif; color: var(--text, #d8dee9); box-shadow: 0 6px 24px rgba(0,0,0,.5); min-width: 150px; }
  #menu div { padding: 6px 12px; border-radius: 4px; cursor: default; display: flex; justify-content: space-between; gap: 24px; }
  #menu div:hover { background: var(--line, #3b4252); }
  #menu span { color: var(--dim, #7b8496); }
  /* Heartbeat cursor: drawn by us under the text, in place of xterm's own cursor. */
  .pulse-on .xterm-rows { position: relative; z-index: 1; }
  .term.pulse-on .xterm .xterm-rows .xterm-cursor.xterm-cursor.xterm-cursor.xterm-cursor { background-color: transparent !important; outline: none !important; box-shadow: none !important; }
  .pulse-cursor { position: absolute; z-index: 0; display: none; box-sizing: border-box; pointer-events: none; border-radius: 1px;
                  background: var(--pc); --lo: calc(var(--pg) * 5px); --hi: calc(var(--pg) * 18px); }
  .pulse-cursor.outline { background: transparent; border: 1px solid var(--pc); }
  .pulse-cursor.on { display: block; animation: avamux-beat-once var(--pd, 2s) ease-in-out infinite; }
  .pulse-cursor.on.double { animation-name: avamux-beat; }
  .pulse-cursor.on.idle { animation: none; background: transparent; border: 1px solid var(--pc); opacity: .7; box-shadow: none; }
  .pulse-cursor.bar.on.idle { background: var(--pc); border: 0; opacity: .45; }
  @keyframes avamux-beat-once {
    0%, 100% { opacity: .55; box-shadow: 0 0 var(--lo) 0 var(--pc); }
    35% { opacity: 1; box-shadow: 0 0 var(--hi) calc(var(--pg) * 3px) var(--pc), 0 0 calc(var(--hi) * 2.2) calc(var(--pg) * 2px) color-mix(in srgb, var(--pc) 45%, transparent); }
  }
  @keyframes avamux-beat {
    0%, 42%, 100% { opacity: .62; box-shadow: 0 0 var(--lo) 0 var(--pc); }
    9%  { opacity: 1;   box-shadow: 0 0 var(--hi) calc(var(--pg) * 3px) var(--pc), 0 0 calc(var(--hi) * 2.2) calc(var(--pg) * 2px) color-mix(in srgb, var(--pc) 45%, transparent); }
    19% { opacity: .7;  box-shadow: 0 0 var(--lo) 0 var(--pc); }
    28% { opacity: .92; box-shadow: 0 0 calc(var(--hi) * .7) calc(var(--pg) * 2px) var(--pc), 0 0 calc(var(--hi) * 1.5) 0 color-mix(in srgb, var(--pc) 35%, transparent); }
  }
  /* CRT effect: an overlay that lets clicks through, plus a soft glow on the text. */
  #crt { position: absolute; inset: 0; z-index: 5; pointer-events: none; display: none; }
  .crt-on #crt { display: block;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,calc(var(--ci) * .55)) 100%),
      repeating-linear-gradient(to bottom, rgba(0,0,0,calc(var(--ci) * .32)) 0, rgba(0,0,0,calc(var(--ci) * .32)) 1px, transparent 1px, transparent 3px); }
  .crt-on #crt::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 calc(var(--ci) * 90px) rgba(0,0,0,calc(var(--ci) * .6)); }
  .crt-on.crt-flicker #crt { animation: avamux-flicker 5s steps(1) infinite; }
  .crt-on .xterm-rows { text-shadow: 0 0 calc(var(--ci) * 5px) currentColor; }
  @keyframes avamux-flicker { 0%, 100% { opacity: 1; } 7% { opacity: .93; } 8% { opacity: 1; } 52% { opacity: .96; } 53% { opacity: 1; } 81% { opacity: .92; } 82% { opacity: 1; } }
  .xterm-viewport::-webkit-scrollbar { width: 10px; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: var(--line, #3b4252); border-radius: 5px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="crt"></div>
<div id="empty">No terminal open</div>
<div id="menu">
  <div data-a="copy">Copy <span>Ctrl+Shift+C</span></div>
  <div data-a="paste">Paste <span>Ctrl+Shift+V</span></div>
  <div data-a="selectAll">Select all</div>
  <div data-a="clear">Clear scrollback</div>
</div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-unicode11.js"></script>
<script src="addon-web-links.js"></script>
<script src="addon-webgl.js"></script>
<script src="options.js"></script>
<script src="terminal.js"></script>
</body>
</html>
