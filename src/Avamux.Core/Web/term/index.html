<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>avamux terminals</title>
<link rel="stylesheet" href="xterm.css">
<style>
  @font-face { font-family: "avamux-symbols"; src: url("fonts/SymbolsNerdFontMono-Regular.ttf") format("truetype"); font-display: block; }
  html, body { margin: 0; height: 100%; background: #11131a; overflow: hidden; }
  #root { position: absolute; inset: 0; }
  .term { position: absolute; inset: 4px 0 0 6px; visibility: hidden; }
  .term.active { visibility: visible; }
  /* Split panes: the ones without the keyboard are dimmed, and a divider sits in the gap between them (a hairline
     that thickens in the accent colour under the pointer and while dragged). */
  #root.split .term.active:not(.focused) { opacity: .62; }
  .divider { position: absolute; z-index: 4; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .divider.col { cursor: col-resize; }
  .divider.row { cursor: row-resize; flex-direction: column; }
  .divider::before { content: ""; background: var(--line, #3b4252); }
  .divider.col::before { width: 1px; height: 100%; }
  .divider.row::before { height: 1px; width: 100%; }
  .divider:hover::before, .divider.dragging::before { background: var(--accent, #61afef); }
  .divider.col:hover::before, .divider.col.dragging::before { width: 3px; }
  .divider.row:hover::before, .divider.row.dragging::before { height: 3px; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           color: #6b7280; font: 14px system-ui, sans-serif; }
  #menu { position: absolute; display: none; z-index: 10; background: var(--panel, #1f2330); border: 1px solid var(--line, #3b4252); border-radius: 6px;
          padding: 4px; font: 13px system-ui, sans-serif; color: var(--text, #d8dee9); box-shadow: 0 6px 24px rgba(0,0,0,.5); min-width: 150px; }
  #menu div { padding: 6px 12px; border-radius: 4px; cursor: default; display: flex; justify-content: space-between; gap: 24px; }
  #menu div:hover { background: var(--line, #3b4252); }
  #menu span { color: var(--dim, #7b8496); }
  #menu hr { margin: 4px 0; border: 0; border-top: 1px solid var(--line, #3b4252); }
  #menu div.off { color: var(--dim, #7b8496); }
  #menu div.sub { position: relative; padding-right: 26px; }
  #menu div.sub::after { content: "›"; position: absolute; right: 10px; color: var(--dim, #7b8496); }
  #menu div.sub > section { display: none; position: absolute; left: 100%; top: -5px; background: var(--panel, #1f2330); border: 1px solid var(--line, #3b4252);
          border-radius: 6px; padding: 4px; min-width: 170px; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  #menu div.sub:hover > section { display: block; }
  #menu section div { display: block; }
  /* Heartbeat cursor: drawn by us under the text, in place of xterm's own cursor. */
  .pulse-on .xterm-rows { position: relative; z-index: 1; }
  .term.pulse-on .xterm .xterm-rows .xterm-cursor.xterm-cursor.xterm-cursor.xterm-cursor { background-color: transparent !important; outline: none !important; box-shadow: none !important; }
  /* Only opacity is animated (the glow is a fixed shadow on ::after that fades in and out), and in steps: the web
     view paints on the CPU and hands every changed frame to the window, so a smooth 60 frames a second costs
     several percent of a core for as long as the terminal is open. Each rise or fall takes 14 steps instead. */
  .pulse-cursor { position: absolute; left: 0; top: 0; z-index: 0; display: none; pointer-events: none; will-change: transform;
                  --lo: calc(var(--pg) * 5px); --hi: calc(var(--pg) * 18px); }
  .pulse-cursor.on { display: block; }
  .pulse-cursor::before, .pulse-cursor::after { content: ""; position: absolute; inset: 0; box-sizing: border-box; border-radius: 1px; will-change: opacity; }
  .pulse-cursor::before { background: var(--pc); box-shadow: 0 0 var(--lo) 0 var(--pc); opacity: .55;
                          animation: avamux-beat-once var(--pd, 2s) steps(14) infinite; }
  .pulse-cursor::after { opacity: 0; animation: avamux-glow-once var(--pd, 2s) steps(14) infinite;
                         box-shadow: 0 0 var(--hi) calc(var(--pg) * 3px) var(--pc), 0 0 calc(var(--hi) * 2.2) calc(var(--pg) * 2px) color-mix(in srgb, var(--pc) 45%, transparent); }
  .pulse-cursor.outline::before { background: transparent; border: 1px solid var(--pc); }
  .pulse-cursor.double::before { animation-name: avamux-beat; }
  .pulse-cursor.double::after { animation-name: avamux-glow; }
  .pulse-cursor.idle::before { animation: none; background: transparent; border: 1px solid var(--pc); opacity: .7; box-shadow: none; }
  .pulse-cursor.idle::after { display: none; }
  .pulse-cursor.bar.idle::before { background: var(--pc); border: 0; opacity: .45; }
  @keyframes avamux-beat-once { 0%, 100% { opacity: .55; } 35% { opacity: 1; } }
  @keyframes avamux-glow-once { 0%, 100% { opacity: 0; } 35% { opacity: 1; } }
  @keyframes avamux-beat { 0%, 42%, 100% { opacity: .62; } 9% { opacity: 1; } 19% { opacity: .7; } 28% { opacity: .92; } }
  @keyframes avamux-glow { 0%, 42%, 100% { opacity: 0; } 9% { opacity: 1; } 19% { opacity: .08; } 28% { opacity: .55; } }
  /* CRT effect: an overlay that lets clicks through, plus a soft glow on the text. The overlay is a canvas that
     terminal.js draws once per size: the web view paints on the CPU, and gradients there cost a full repaint of
     the screen for every frame of output, where a ready-made bitmap is only copied. */
  #crt { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: none; }
  .crt-on #crt { display: block; }
  .crt-on.crt-flicker #crt { animation: avamux-flicker 5s steps(1) infinite; }
  /* The glow. A text-shadow blurs every glyph on its own, on the CPU, on every frame of output: with it a key press in
     nvim took 600 ms to show instead of 33. One drop-shadow over the whole text layer costs a single blur (about
     40 ms), but it glows in one colour, the foreground's. The per-glyph one stays as the "colour" choice. */
  .crt-glow:not(.flooding) .xterm-rows { filter: drop-shadow(0 0 calc(var(--ci) * 6px) currentColor); }
  .crt-glow-colour .xterm-rows { text-shadow: 0 0 calc(var(--ci) * 5px) currentColor; }
  @keyframes avamux-flicker { 0%, 100% { opacity: 1; } 7% { opacity: .93; } 8% { opacity: 1; } 52% { opacity: .96; } 53% { opacity: 1; } 81% { opacity: .92; } 82% { opacity: 1; } }
  .xterm-viewport::-webkit-scrollbar { width: 10px; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: var(--line, #3b4252); border-radius: 5px; }
</style>
</head>
<body>
<div id="root"></div>
<canvas id="crt"></canvas>
<div id="empty">No terminal open</div>
<div id="menu">
  <div data-a="copy">Copy <span>Ctrl+Shift+C</span></div>
  <div data-a="paste">Paste <span>Ctrl+Shift+V</span></div>
  <div data-a="selectAll">Select all</div>
  <div data-a="clear">Clear scrollback</div>
</div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-unicode11.js"></script>
<script src="addon-web-links.js"></script>
<script src="addon-webgl.js"></script>
<script src="options.js"></script>
<script src="terminal.js"></script>
</body>
</html>
