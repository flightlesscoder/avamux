<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>avamux dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Dashboard</h1>
    <p>This page lives in your avamux data folder. Edit <code>index.html</code>, <code>style.css</code> and <code>app.js</code> to make it yours.</p>
  </header>
  <main>
    <section class="card">
      <h2>Terminals <button id="new-terminal">New</button></h2>
      <ul id="terminals"><li class="muted">Loading…</li></ul>
    </section>
    <section class="card">
      <h2>Watching <button id="check-watches">Check now</button></h2>
      <ul id="watches"><li class="muted">Loading…</li></ul>
    </section>
    <section class="card">
      <h2>Upcoming events</h2>
      <ul id="events"><li class="muted">Loading…</li></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
